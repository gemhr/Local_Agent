apiVersion: v1
kind: ConfigMap
metadata:
  name: localagent-config
data:
  LOCAL_AGENT_ENVIRONMENT_PROFILE: "LOCAL"
  LOCAL_AGENT_ENVIRONMENT_ID: "kubernetes"
  LOCAL_AGENT_RUNTIME_PROFILE: "PRODUCTION"
  LOCAL_AGENT_API_HOST: "0.0.0.0"
  LOCAL_AGENT_API_PORT: "8000"
  LOCAL_AGENT_API_BASE_URL: "http://localagent-api:8000"
  LOCAL_AGENT_REDIS_URL: "redis://redis:6379/0"
  LOCAL_AGENT_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  LOCAL_AGENT_KAFKA_ENABLED: "true"
  LOCAL_AGENT_KAFKA_JOB_TOPIC: "evaluation.jobs.v1"
  LOCAL_AGENT_KAFKA_JOB_DLQ_TOPIC: "evaluation.jobs.v1.dlq"
  LOCAL_AGENT_KAFKA_CONSUMER_GROUP: "localagent-evaluation-worker-v1"
  LOCAL_AGENT_KAFKA_TOPIC_PARTITIONS: "2"
  LOCAL_AGENT_LLM_BACKEND: "remote"
  LOCAL_AGENT_REMOTE_PROVIDER_KIND: "deepseek"
  LOCAL_AGENT_REMOTE_API_BASE_URL: "https://api.deepseek.com"
  LOCAL_AGENT_REMOTE_VERIFY_TLS: "true"
  LOCAL_AGENT_KB_REQUIRED: "false"
  LOCAL_AGENT_CHROMA_DIR: "/tmp/chroma_db"
  LOCAL_AGENT_METRICS_ENABLED: "true"
