apiVersion: batch/v1
kind: Job
metadata:
  name: localagent-migrate
  labels: {app.kubernetes.io/name: localagent-migrate}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata: {labels: {app.kubernetes.io/name: localagent-migrate}}
    spec:
      restartPolicy: Never
      serviceAccountName: localagent
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: localagent:stage6-wp8
          command: ["alembic", "upgrade", "head"]
          envFrom: [{configMapRef: {name: localagent-config}}]
          env:
            - name: LOCAL_AGENT_DATABASE_URL
              valueFrom: {secretKeyRef: {name: localagent-secrets, key: LOCAL_AGENT_DATABASE_URL}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 250m, memory: 256Mi}}
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: localagent-kafka-init
  labels: {app.kubernetes.io/name: localagent-kafka-init}
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata: {labels: {app.kubernetes.io/name: localagent-kafka-init}}
    spec:
      restartPolicy: Never
      serviceAccountName: localagent
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: kafka-init
          image: localagent:stage6-wp8
          command: ["python", "-m", "scripts.provision_kafka_topics"]
          envFrom: [{configMapRef: {name: localagent-config}}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 250m, memory: 256Mi}}
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localagent-api
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: localagent-api}}
  template:
    metadata: {labels: {app.kubernetes.io/name: localagent-api}}
    spec:
      serviceAccountName: localagent
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: localagent:stage6-wp8
          command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{name: http, containerPort: 8000}]
          envFrom: [{configMapRef: {name: localagent-config}}]
          env:
            - name: LOCAL_AGENT_KAFKA_ENABLED
              value: "false"
            - name: LOCAL_AGENT_REMOTE_API_KEY
              valueFrom: {secretKeyRef: {name: localagent-secrets, key: LOCAL_AGENT_REMOTE_API_KEY}}
            - name: LOCAL_AGENT_JWT_PUBLIC_KEY
              valueFrom: {secretKeyRef: {name: localagent-secrets, key: LOCAL_AGENT_JWT_PUBLIC_KEY}}
            - name: LOCAL_AGENT_DATABASE_URL
              valueFrom: {secretKeyRef: {name: localagent-secrets, key: LOCAL_AGENT_DATABASE_URL}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 6}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 3}
          startupProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 24}
          volumeMounts: [{name: tmp, mountPath: /tmp}, {name: chroma, mountPath: /tmp/chroma_db}]
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: 1, memory: 1Gi}}
      volumes: [{name: tmp, emptyDir: {}}, {name: chroma, emptyDir: {}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localagent-outbox-publisher
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app.kubernetes.io/name: localagent-outbox-publisher}}
  template:
    metadata: {labels: {app.kubernetes.io/name: localagent-outbox-publisher}}
    spec:
      serviceAccountName: localagent
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: publisher
          image: localagent:stage6-wp8
          command: ["python", "-m", "scripts.run_outbox_publisher", "--metrics-port", "9101", "--metrics-address", "0.0.0.0"]
          ports: [{name: metrics, containerPort: 9101}]
          envFrom: [{configMapRef: {name: localagent-config}}]
          env:
            - name: LOCAL_AGENT_DATABASE_URL
              valueFrom: {secretKeyRef: {name: localagent-secrets, key: LOCAL_AGENT_DATABASE_URL}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe: {exec: {command: ["python", "-m", "scripts.healthcheck", "--component", "publisher"]}, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 6}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 500m, memory: 512Mi}}
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localagent-evaluation-worker
spec:
  replicas: 1
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app.kubernetes.io/name: localagent-evaluation-worker}}
  template:
    metadata: {labels: {app.kubernetes.io/name: localagent-evaluation-worker}}
    spec:
      serviceAccountName: localagent
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 75
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: localagent:stage6-wp8
          command: ["python", "-m", "scripts.run_evaluation_worker", "--metrics-port", "9102", "--metrics-address", "0.0.0.0"]
          ports: [{name: metrics, containerPort: 9102}]
          envFrom: [{configMapRef: {name: localagent-config}}]
          env:
            - name: LOCAL_AGENT_DATABASE_URL
              valueFrom: {secretKeyRef: {name: localagent-secrets, key: LOCAL_AGENT_DATABASE_URL}}
            - name: LOCAL_AGENT_REMOTE_API_KEY
              valueFrom: {secretKeyRef: {name: localagent-secrets, key: LOCAL_AGENT_REMOTE_API_KEY}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe: {exec: {command: ["python", "-m", "scripts.healthcheck", "--component", "worker"]}, periodSeconds: 10, timeoutSeconds: 5, failureThreshold: 6}
          volumeMounts: [{name: tmp, mountPath: /tmp}, {name: chroma, mountPath: /tmp/chroma_db}]
          resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: 1, memory: 1536Mi}}
      volumes: [{name: tmp, emptyDir: {}}, {name: chroma, emptyDir: {}}]
