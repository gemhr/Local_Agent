  <rect x="95" y="315" width="250" height="88" rx="12" fill="url(#boxTeal)" filter="url(#shadow)"/>
  <text x="220" y="346" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="white" font-weight="700">AgentRouter</text>
  <text x="220" y="368" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#dcfce7">路由决策 / Prompt 构建 / 状态管理</text>
  <text x="220" y="388" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#dcfce7">summary + tool + rag + orchestration</text>

  <rect x="405" y="315" width="250" height="88" rx="12" fill="url(#boxTeal)" filter="url(#shadow)"/>
  <text x="530" y="346" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="white" font-weight="700">Core Router Agent</text>
  <text x="530" y="368" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#dcfce7">可直接回答 or 委派专家</text>
  <text x="530" y="388" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#dcfce7">Delegate: data/code/knowledge</text>

  <rect x="715" y="315" width="310" height="88" rx="12" fill="url(#boxTeal)" filter="url(#shadow)"/>
  <text x="870" y="346" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="white" font-weight="700">Specialist Agents</text>
  <text x="870" y="368" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#dcfce7">Data Analyst / Code Expert / Knowledge Expert</text>
  <text x="870" y="388" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#dcfce7">并行任务处理 + 汇总</text>

  <rect x="1090" y="315" width="250" height="88" rx="12" fill="url(#boxTeal)" filter="url(#shadow)"/>
  <text x="1215" y="346" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="white" font-weight="700">Synthesis Output</text>
  <text x="1215" y="368" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#dcfce7">最终答案融合</text>
  <text x="1215" y="388" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#dcfce7">含本地引用/无信源声明</text>

  <rect x="1365" y="315" width="330" height="88" rx="12" fill="url(#boxTeal)" filter="url(#shadow)"/>
  <text x="1530" y="346" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="white" font-weight="700">Signal Strategy Agent (Hypothetical)</text>
  <text x="1530" y="368" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#dcfce7">自然语言需求 -> 典型CDT/循环下发/异常注入信令</text>
  <text x="1530" y="388" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#dcfce7">场景学习模板 + 约束检查 + 可直接下发</text>

  <line x1="345" y1="359" x2="405" y2="359" stroke="#334155" stroke-width="2.1" marker-end="url(#arrow)"/>
  <line x1="655" y1="359" x2="715" y2="359" stroke="#334155" stroke-width="2.1" marker-end="url(#arrow)"/>
  <line x1="1025" y1="359" x2="1090" y2="359" stroke="#334155" stroke-width="2.1" marker-end="url(#arrow)"/>
  <line x1="1340" y1="359" x2="1365" y2="359" stroke="#334155" stroke-width="2.1" marker-end="url(#arrow)"/>

  <line x1="850" y1="220" x2="220" y2="315" stroke="#0f766e" stroke-width="1.9" marker-end="url(#arrow)" stroke-dasharray="6,4"/>
  <text x="500" y="278" font-family="Segoe UI, Arial" font-size="12" fill="#115e59">请求下沉到编排层</text>

