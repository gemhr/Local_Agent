  <line x1="680" y1="865" x2="755" y2="865" stroke="#334155" stroke-width="2.1" marker-end="url(#arrow)"/>
  <line x1="1045" y1="865" x2="1120" y2="865" stroke="#334155" stroke-width="2.1" marker-end="url(#arrow)"/>
