  <text x="865" y="600" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#fff7ed">messages / conversation_summaries / FTS</text>
  <text x="865" y="620" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#fff7ed">direct/orchestration + 自动蒸馏</text>

  <rect x="1085" y="545" width="255" height="95" rx="12" fill="url(#boxOrange)" filter="url(#shadow)"/>
