  <text x="1212" y="600" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#fff7ed">蒸馏触发日志 / RAG 命中信息</text>
  <text x="1212" y="620" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#fff7ed">错误与性能排查</text>

  <rect x="1365" y="545" width="330" height="95" rx="12" fill="url(#boxOrange)" filter="url(#shadow)"/>
  <text x="1530" y="578" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="white" font-weight="700">report_parser Function Calling</text>
  <text x="1530" y="600" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#fff7ed">拖拽码流上报 -> CHR / 干扰检测 / 话统解析</text>
  <text x="1530" y="620" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#fff7ed">结构化结果聚合 + 异常定位 + 指标抽取</text>

  <line x1="220" y1="403" x2="220" y2="545" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="403" x2="530" y2="545" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="865" y1="403" x2="865" y2="545" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1215" y1="403" x2="1215" y2="545" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1530" y1="403" x2="1530" y2="545" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

