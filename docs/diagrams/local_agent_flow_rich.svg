  <text x="530" y="620" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#fff7ed">get_system_status + 扩展函数</text>

  <rect x="715" y="545" width="300" height="95" rx="12" fill="url(#boxOrange)" filter="url(#shadow)"/>
