  <line x1="1120" y1="925" x2="680" y2="925" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="7,5"/>
  <text x="905" y="948" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" fill="#6d28d9">构建阶段: 文件 -> 切片 -> 向量化</text>

  <line x1="900" y1="805" x2="900" y2="640" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="920" y="714" font-family="Segoe UI, Arial" font-size="12" fill="#1f2937">检索阶段: Chroma -> Router</text>

  <line x1="1215" y1="640" x2="1470" y2="185" stroke="#334155" stroke-width="1.9" marker-end="url(#arrow)"/>
  <line x1="1215" y1="359" x2="1470" y2="185" stroke="#334155" stroke-width="1.9" marker-end="url(#arrow)"/>
  <line x1="1530" y1="640" x2="1570" y2="805" stroke="#334155" stroke-width="1.9" marker-end="url(#arrow)"/>
