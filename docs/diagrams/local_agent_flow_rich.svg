  <rect x="1470" y="150" width="260" height="70" rx="12" fill="#0f172a" filter="url(#shadow)"/>
  <text x="1600" y="178" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" fill="white" font-weight="700">Final Streaming Answer</text>
  <text x="1600" y="200" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#cbd5e1">带引用 / 无信源声明 / 工具观察融合</text>

  <text x="1600" y="1018" text-anchor="middle" font-family="Segoe UI, Arial" font-size="12" fill="#64748b">
