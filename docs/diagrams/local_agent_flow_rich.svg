<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1050" viewBox="0 0 1800 1050">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="boxBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b6ef2"/>
      <stop offset="100%" stop-color="#1a4fb9"/>
    </linearGradient>
    <linearGradient id="boxTeal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b8a3"/>
      <stop offset="100%" stop-color="#0a7f71"/>
    </linearGradient>
    <linearGradient id="boxOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#f28705"/>
    </linearGradient>
    <linearGradient id="boxPurple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b6bff"/>
      <stop offset="100%" stop-color="#5f42d8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#94a3b8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1800" height="1050" fill="url(#bgGrad)"/>

  <text x="900" y="52" text-anchor="middle" font-family="Segoe UI, Arial" font-size="34" font-weight="700" fill="#1e293b">
    Local Agent 端到端业务 + 系统架构流程图（增强版）
  </text>
  <text x="900" y="82" text-anchor="middle" font-family="Segoe UI, Arial" font-size="17" fill="#475569">
    用户交互 / 多智能体编排 / 本地工具 / 记忆蒸馏 / 知识库向量检索 / 后端接口
  </text>

  <!-- swimlanes -->
  <rect x="40" y="110" width="1720" height="130" rx="14" fill="#e0f2fe" opacity="0.55"/>
  <rect x="40" y="255" width="1720" height="210" rx="14" fill="#dcfce7" opacity="0.55"/>
  <rect x="40" y="480" width="1720" height="230" rx="14" fill="#fef9c3" opacity="0.5"/>
  <rect x="40" y="725" width="1720" height="280" rx="14" fill="#ede9fe" opacity="0.48"/>

  <text x="58" y="138" font-family="Segoe UI, Arial" font-size="18" font-weight="700" fill="#0f172a">① 交互层（UI / API）</text>
  <text x="58" y="283" font-family="Segoe UI, Arial" font-size="18" font-weight="700" fill="#0f172a">② 编排层（Router / Agent）</text>
  <text x="58" y="508" font-family="Segoe UI, Arial" font-size="18" font-weight="700" fill="#0f172a">③ 能力层（LLM / Tools / Memory）</text>
  <text x="58" y="753" font-family="Segoe UI, Arial" font-size="18" font-weight="700" fill="#0f172a">④ 知识层（Loader / Chroma / 本地知识库）</text>

  <!-- Row 1 -->
  <rect x="95" y="150" width="230" height="70" rx="12" fill="url(#boxBlue)" filter="url(#shadow)"/>
  <text x="210" y="178" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="white" font-weight="700">Desktop UI / Chat Panel</text>
  <text x="210" y="200" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#dbeafe">用户输入、历史查看、附件上传</text>

  <rect x="430" y="150" width="210" height="70" rx="12" fill="url(#boxBlue)" filter="url(#shadow)"/>
  <text x="535" y="178" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="white" font-weight="700">FastAPI /api/chat</text>
  <text x="535" y="200" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#dbeafe">流式响应 + 会话接口</text>

  <rect x="745" y="150" width="210" height="70" rx="12" fill="url(#boxBlue)" filter="url(#shadow)"/>
  <text x="850" y="178" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="white" font-weight="700">ChatService</text>
  <text x="850" y="200" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#dbeafe">请求桥接 / 历史分页</text>

  <line x1="325" y1="185" x2="430" y2="185" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <line x1="640" y1="185" x2="745" y2="185" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>

