  <text x="900" y="865" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#ede9fe">相似度检索 / relevance score</text>
  <text x="900" y="887" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#ede9fe">search / search_with_scores</text>

  <rect x="1120" y="805" width="290" height="120" rx="12" fill="url(#boxPurple)" filter="url(#shadow)"/>
  <text x="1265" y="842" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="white" font-weight="700">Local Knowledge Base</text>
  <text x="1265" y="865" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#ede9fe">data/knowledge_base</text>
  <text x="1265" y="887" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#ede9fe">版本化文档资产</text>

  <rect x="1445" y="805" width="250" height="120" rx="12" fill="url(#boxPurple)" filter="url(#shadow)"/>
  <text x="1570" y="842" text-anchor="middle" font-family="Segoe UI, Arial" font-size="18" fill="white" font-weight="700">Excel Report Builder</text>
  <text x="1570" y="865" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#ede9fe">解析结果自动生成Excel报告</text>
  <text x="1570" y="887" text-anchor="middle" font-family="Segoe UI, Arial" font-size="13" fill="#ede9fe">含摘要、异常明细、统计图表</text>

