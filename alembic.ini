# LocalAgent Alembic configuration.
#
# Notes:
# * No DSN is stored here. The URL is read from Settings (environment) by
#   alembic/env.py so credentials never enter a version-controlled file.
# * Migrations are NEVER executed from FastAPI startup. Stage6 freezes
#   MIGRATION_OWNER = explicit deployment command / Compose init / K8s Job.
#
# Explicit usage:
#   uv run alembic upgrade head
#   uv run alembic current
#   uv run alembic history
#
# This file must stay ASCII-only: Alembic reads it with the platform locale
# codec, which is not UTF-8 on Windows.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Injected by env.py; kept empty here to avoid accidental reuse.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
